name: Собрать APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          npm install
          pip install pillow
      - name: Создать Android-проект
        run: |
          npx cap add android
          python tools/make_icons.py
          npx capacitor-assets generate --android --iconBackgroundColor '#2f6f5e' --iconBackgroundColorDark '#2f6f5e'
          python tools/patch_android.py
          npx cap sync android
      - name: Собрать APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: moy-pomoshnik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
